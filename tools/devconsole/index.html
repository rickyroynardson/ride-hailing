<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev Console</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6eb; --text: #1b1f24; --muted: #667085;
    --accent: #2563eb; --accent-soft: #e8efff; --ok: #15803d; --ok-soft: #e7f6ec;
    --warn: #b45309; --warn-soft: #fdf3e2; --bad: #b91c1c; --bad-soft: #fdeaea;
    --rider: #2563eb; --dropoff: #7c3aed; --driver: #16a34a; --stale: #9ca3af;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8ec; --muted: #98a2b3;
      --accent: #6b9bff; --accent-soft: #1d2740; --ok: #4ade80; --ok-soft: #14271c;
      --warn: #fbbf24; --warn-soft: #2d2412; --bad: #f87171; --bad-soft: #2e1717;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, sans-serif; }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .status { margin-left: auto; color: var(--muted); font-size: 12px; }
  .status.bad { color: var(--bad); }
  .layout { display: grid; grid-template-columns: 290px 1fr 440px; min-height: 0; }
  aside, .side { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .side { border-right: 0; border-left: 1px solid var(--border); }
  .section-head { display: flex; gap: 6px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .section-head strong { margin-right: auto; }
  .scroll { overflow: auto; min-height: 0; flex: 1; }
  button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .card { margin: 8px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
  .card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .card .top { display: flex; align-items: center; gap: 6px; }
  .card .name { font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .card .actions { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .hint { margin: 8px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--text); font-size: 12px; }
  .pill { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; line-height: 18px; background: var(--border); color: var(--text); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.info { background: var(--accent-soft); color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #map { height: 100%; width: 100%; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 12px; background: none; }
  .tabs button.active { border-bottom-color: var(--accent); color: var(--accent); }
  .tabs .count { color: var(--muted); }
  .filters { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  select { font: inherit; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 2px 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--panel); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .call { padding: 7px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .call .row { display: flex; gap: 8px; align-items: center; }
  .call .method { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .call .when, .call .ms { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .call pre { margin: 6px 0 0; padding: 8px; background: var(--bg); border-radius: 6px; font: 11px/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; }
  .call .label { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .empty { padding: 16px 12px; color: var(--muted); }
  .legend { display: flex; gap: 12px; color: var(--muted); font-size: 12px; align-items: center; }
  .legend span { display: inline-flex; gap: 5px; align-items: center; }
  .offer { margin-top: 8px; padding: 8px; border-radius: 6px; background: var(--warn-soft); }
  .offer .actions { margin-top: 6px; }
  button.danger { color: var(--bad); }
  .toast { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); padding: 7px 12px; border-radius: 8px; z-index: 2000; display: none; max-width: 70vw; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 250px 1fr; } .side { grid-column: 1 / -1; height: 45vh; border-left: 0; border-top: 1px solid var(--border); } .layout { grid-template-rows: 1fr auto; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Ride-hailing dev console</h1>
    <div class="legend">
      <span><i class="dot" style="background:var(--driver)"></i>driver online</span>
      <span><i class="dot" style="background:var(--stale)"></i>stale (&gt;30s)</span>
      <span><i class="dot" style="background:var(--rider)"></i>pickup</span>
      <span><i class="dot" style="background:var(--dropoff)"></i>dropoff</span>
    </div>
    <div class="status" id="status">connecting…</div>
    <button onclick="clearLog()">Clear log</button>
    <button onclick="resetAll()" title="Deletes all rides, offers, match requests and driver locations, plus users the console created">Reset all data</button>
  </header>
  <div class="layout">
    <aside>
      <div class="section-head">
        <strong>Actors</strong>
        <button onclick="createActor('rider')">+ Rider</button>
        <button onclick="createActor('driver')">+ Driver</button>
      </div>
      <div id="hint"></div>
      <div class="scroll" id="actors"></div>
    </aside>
    <div id="map"></div>
    <div class="side">
      <div class="tabs" id="tabs"></div>
      <div id="filters"></div>
      <div class="scroll" id="panel"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const ui = { selected: null, tab: 'calls', draft: {}, expanded: new Set(), showHeartbeats: false, actorFilter: '' };
let state = { actors: [], drivers: [], rides: [], offers: [], matchRequests: [], calls: [], errors: {}, now: Date.now() };

const map = L.map('map').setView([-6.1754, 106.8272], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
const layer = L.layerGroup().addTo(map);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const short = id => id ? id.slice(0, 8) : '—';
const nameOf = id => (state.actors.find(a => a.id === id) || {}).name || short(id);
const ago = t => { const s = Math.max(0, Math.round((state.now - t) / 1000)); return s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`; };
const STATUS_PILL = { requested: 'info', accepted: 'ok', in_progress: 'ok', completed: '', cancelled: 'bad', pending: 'info', declined: 'warn', expired: 'warn', matching: 'info', matched: 'ok', no_driver: 'bad' };
const codeClass = c => c === 'OK' ? 'ok' : ['Internal', 'Unavailable', 'Unknown', 'DeadlineExceeded', 'DataLoss'].includes(c) ? 'bad' : 'warn';
const outcome = o => (o || '').replace('UPDATE_OUTCOME_', '').toLowerCase();

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 4000);
}

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { toast(data.error || res.statusText); throw new Error(data.error); }
  return data;
}

async function createActor(kind) {
  const a = await api('POST', '/api/actors', { kind });
  ui.selected = a.id; ui.draft = {};
  await poll();
}

function select(id) { ui.selected = ui.selected === id ? null : id; ui.draft = {}; render(); }

map.on('click', async e => {
  const a = state.actors.find(x => x.id === ui.selected);
  if (!a) return;
  const p = { lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6) };
  if (a.kind === 'driver') {
    await api('POST', `/api/actors/${a.id}/location`, p);
    await poll();
  } else {
    if (!ui.draft.pickup || ui.draft.dropoff) ui.draft = { pickup: p };
    else ui.draft.dropoff = p;
    render();
  }
});

async function goOffline(id) { await api('POST', `/api/actors/${id}/offline`); await poll(); }
async function checkOffer(id) { await api('POST', `/api/actors/${id}/offer`); ui.tab = 'calls'; await poll(); }
async function answerOffer(id, offerId, answer) { await api('POST', `/api/actors/${id}/offers/${offerId}/${answer}`); await poll(); }
async function tripStep(id, rideId, step) { await api('POST', `/api/actors/${id}/rides/${rideId}/${step}`); await poll(); }
async function cancelRide(id, rideId) { await api('POST', `/api/actors/${id}/rides/${rideId}/cancel`); await poll(); }
async function removeActor(id) { await api('POST', `/api/actors/${id}/remove`); if (ui.selected === id) ui.selected = null; await poll(); }
async function clearLog() { await api('POST', '/api/calls/clear'); ui.expanded.clear(); await poll(); }
async function resetAll() {
  if (!confirm('Reset all dev data?\n\nDeletes every ride, outbox message, offer, match request and driver location, and the users this console created. Users you registered yourself are kept.')) return;
  const removed = await api('POST', '/api/reset');
  ui.selected = null; ui.draft = {}; ui.expanded.clear();
  toast(`Reset: ${Object.entries(removed).map(([k, n]) => `${n} ${k}`).join(', ')}`);
  await poll();
}
async function requestRide(id) {
  await api('POST', `/api/actors/${id}/rides`, ui.draft);
  ui.draft = {}; ui.tab = 'rides';
  await poll();
}
async function startMatching(rideId) { await api('POST', `/api/rides/${rideId}/start-matching`); ui.tab = 'offers'; await poll(); }

function renderActors() {
  const sel = state.actors.find(a => a.id === ui.selected);
  document.getElementById('hint').innerHTML = !sel ? '' :
    sel.kind === 'driver' ? `<div class="hint"><b>${esc(sel.name)}</b>: click the map to place or move. Placing starts a heartbeat every 4s.</div>` :
    `<div class="hint"><b>${esc(sel.name)}</b>: click the map for ${ui.draft.pickup && !ui.draft.dropoff ? '<b>dropoff</b>' : '<b>pickup</b>'}${ui.draft.pickup ? ', then request.' : ', then dropoff.'}</div>`;

  document.getElementById('actors').innerHTML = state.actors.length ? state.actors.map(a => {
    const expiresIn = Math.round(a.tokenExpiry - state.now / 1000);
    const claims = a.claims.map(c => `<span class="pill ok">${esc(c)}</span>`).join(' ');
    let status = '', actions = '';
    let extra = '';
    if (a.kind === 'driver') {
      status = a.online ? '<span class="pill ok">online</span>' : a.location ? '<span class="pill">offline</span>' : '<span class="pill">not placed</span>';
      if (a.lastOutcome) status += ` <span class="pill ${a.lastOutcome.startsWith('UPDATE_OUTCOME_STORED') ? 'ok' : 'warn'}">${esc(outcome(a.lastOutcome))}</span>`;
      if (a.online) actions = `<button onclick="event.stopPropagation(); goOffline('${a.id}')">Go offline</button>`;
      actions += `<button onclick="event.stopPropagation(); checkOffer('${a.id}')" title="Calls GetOffer as this driver, like the driver app polling">GetOffer</button>`;
      const offer = state.offers.find(o => o.driverId === a.id && o.status === 'pending');
      const onRide = state.rides.find(r => r.driverId === a.id && ['accepted', 'in_progress'].includes(r.status));
      if (offer) {
        const left = Math.round((Date.parse(offer.expiresAt) - state.now) / 1000);
        extra = `<div class="offer" onclick="event.stopPropagation()"><b>Offer</b> for ride <span class="mono">${short(offer.rideId)}</span> · ${left > 0 ? left + 's left' : 'expiring…'}
          <div class="actions"><button class="primary" onclick="answerOffer('${a.id}', '${offer.id}', 'accept')">Accept</button>
          <button onclick="answerOffer('${a.id}', '${offer.id}', 'decline')">Decline</button></div></div>`;
      } else if (onRide) {
        status += ` <span class="pill info">${onRide.status === 'accepted' ? 'to pickup' : 'on trip'} ${short(onRide.id)}</span>`;
        actions += onRide.status === 'accepted'
          ? `<button class="primary" onclick="event.stopPropagation(); tripStep('${a.id}', '${onRide.id}', 'start')">Start trip</button>`
          : `<button class="primary" onclick="event.stopPropagation(); tripStep('${a.id}', '${onRide.id}', 'complete')">Complete trip</button>`;
      }
    } else {
      const ride = state.rides.find(r => r.id === a.rideId);
      if (ride) status = `<span class="pill ${STATUS_PILL[ride.status] || ''}">${esc(ride.status)}</span>${ride.driverId ? ` <span class="pill ok">${esc(nameOf(ride.driverId))}</span>` : ''}`;
      if (ride && ['requested', 'accepted'].includes(ride.status)) {
        actions += `<button onclick="event.stopPropagation(); cancelRide('${a.id}', '${ride.id}')">Cancel ride</button>`;
      }
      if (a.id === ui.selected) {
        actions += `<button class="primary" ${ui.draft.pickup && ui.draft.dropoff ? '' : 'disabled'} onclick="event.stopPropagation(); requestRide('${a.id}')">Request ride</button>`
          + (ui.draft.pickup ? `<button onclick="event.stopPropagation(); ui.draft = {}; render()">Clear</button>` : '');
      }
    }
    return `<div class="card ${a.id === ui.selected ? 'selected' : ''}" onclick="select('${a.id}')">
      <div class="top"><i class="dot" style="background:var(--${a.kind === 'driver' ? 'driver' : 'rider'})"></i>
        <span class="name">${esc(a.name)}</span> ${claims} <span style="margin-left:auto">${status}</span></div>
      <div class="meta mono">${esc(a.id)}</div>
      <div class="meta">token refreshes automatically · expires in ${expiresIn > 0 ? expiresIn + 's' : 'now'}</div>
      ${extra}
      <div class="actions">${actions}<button class="danger" style="margin-left:auto" onclick="event.stopPropagation(); removeActor('${a.id}')" title="Stops the heartbeat, goes offline, forgets the session">Remove</button></div>
    </div>`;
  }).join('') : '<div class="empty">No actors yet. Add a rider or a driver.</div>';
}

function renderMap() {
  layer.clearLayers();
  for (const r of state.rides.filter(r => ['requested', 'accepted', 'in_progress'].includes(r.status))) {
    L.polyline([[r.pickup.lat, r.pickup.lng], [r.dropoff.lat, r.dropoff.lng]], { color: css('--rider'), weight: 2, dashArray: r.status === 'requested' ? '6 6' : null }).addTo(layer);
    L.circleMarker([r.pickup.lat, r.pickup.lng], { radius: 7, color: css('--rider'), fillOpacity: .9 }).bindTooltip(`pickup · ${nameOf(r.riderId)} · ${r.status}`).addTo(layer);
    L.circleMarker([r.dropoff.lat, r.dropoff.lng], { radius: 6, color: css('--dropoff'), fillOpacity: .9 }).bindTooltip(`dropoff · ${nameOf(r.riderId)}`).addTo(layer);
  }
  for (const d of state.drivers) {
    const fresh = state.now - d.lastSeen <= 30000;
    const selected = d.id === ui.selected;
    L.circleMarker([d.lat, d.lng], { radius: selected ? 11 : 8, weight: selected ? 3 : 2, color: fresh ? css('--driver') : css('--stale'), fillOpacity: .85 })
      .bindTooltip(`${nameOf(d.id)} · seen ${ago(d.lastSeen)}`).on('click', ev => { L.DomEvent.stopPropagation(ev); select(d.id); }).addTo(layer);
  }
  for (const [k, p] of Object.entries(ui.draft)) {
    L.circleMarker([p.lat, p.lng], { radius: 7, color: css(k === 'pickup' ? '--rider' : '--dropoff'), dashArray: '3 3', fillOpacity: .3 }).bindTooltip(`draft ${k}`).addTo(layer);
  }
}

// timeline shows how long each trip step took: request → accepted → picked up → dropped off.
function timeline(r) {
  const t = k => r[k] && Date.parse(r[k]);
  const secs = (a, b) => `${Math.round((b - a) / 1000)}s`;
  const parts = [];
  if (t('acceptedAt')) parts.push(`matched ${secs(Date.parse(r.createdAt), t('acceptedAt'))}`);
  if (t('startedAt')) parts.push(`pickup ${secs(t('acceptedAt'), t('startedAt'))}`);
  if (t('completedAt')) parts.push(`trip ${secs(t('startedAt'), t('completedAt'))}`);
  return parts.length ? `<div style="color:var(--muted)">${parts.join(' · ')}</div>` : '';
}

function renderPanel() {
  const calls = state.calls.filter(c => (ui.showHeartbeats || !c.heartbeat) && (!ui.actorFilter || c.actor === ui.actorFilter));
  const tabs = [['calls', 'Calls', calls.length], ['rides', 'Rides', state.rides.length], ['offers', 'Offers', state.offers.length]];
  document.getElementById('tabs').innerHTML = tabs.map(([k, label, n]) =>
    `<button class="${ui.tab === k ? 'active' : ''}" onclick="ui.tab='${k}'; render()">${label} <span class="count">${n}</span></button>`).join('');

  const names = [...new Set(state.calls.map(c => c.actor))];
  document.getElementById('filters').innerHTML = ui.tab !== 'calls' ? '' : `<div class="filters">
    <label><input type="checkbox" ${ui.showHeartbeats ? 'checked' : ''} onchange="ui.showHeartbeats=this.checked; render()"> heartbeats</label>
    <label>actor <select onchange="ui.actorFilter=this.value; render()"><option value="">all</option>${names.map(n => `<option ${n === ui.actorFilter ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label></div>`;

  const panel = document.getElementById('panel');
  const err = key => state.errors[key] ? `<div class="empty" style="color:var(--bad)">${esc(state.errors[key])}</div>` : '';
  if (ui.tab === 'calls') {
    panel.innerHTML = calls.length ? calls.map(c => {
      const key = c.at + c.method;
      const open = ui.expanded.has(key);
      return `<div class="call" onclick="toggle('${esc(key)}')">
        <div class="row"><span class="pill ${codeClass(c.code)}">${esc(c.code)}</span>
          <span class="method">${esc(c.method.split('/').pop())} <span style="color:var(--muted)">${esc(c.method.split('/')[0])}</span></span>
          <span class="when">${esc(c.actor)} · ${ago(Date.parse(c.at))}</span><span class="ms">${c.durationMs.toFixed(1)}ms</span></div>
        ${c.error ? `<div class="label" style="color:var(--bad)">${esc(c.error)}</div>` : ''}
        ${open ? `<div class="label">request</div><pre>${esc(JSON.stringify(c.request, null, 2))}</pre>
                  <div class="label">response</div><pre>${esc(JSON.stringify(c.response, null, 2))}</pre>` : ''}
      </div>`;
    }).join('') : '<div class="empty">No calls yet.</div>';
  } else if (ui.tab === 'rides') {
    const requests = Object.fromEntries((state.matchRequests || []).map(m => [m.rideId, m]));
    const matchCell = r => {
      const m = requests[r.id];
      if (!m) return r.status === 'requested'
        ? `<button onclick="startMatching('${r.id}')" title="Calls StartMatching with a service token, as the ride service will in step 6">Start matching</button>` : '—';
      const left = Math.round((Date.parse(m.deadlineAt) - state.now) / 1000);
      const tries = state.offers.filter(o => o.rideId === r.id).length;
      return `<span class="pill ${STATUS_PILL[m.status] || ''}">${esc(m.status)}</span>
        <div style="color:var(--muted)">${tries} offer${tries === 1 ? '' : 's'}${m.status === 'matching' ? ` · gives up in ${Math.max(0, left)}s` : ''}</div>`;
    };
    panel.innerHTML = err('rides') + err('match_requests') + (state.rides.length ? `<table><tr><th>Ride</th><th>Rider</th><th>Driver</th><th>Status</th><th>Matching</th></tr>${state.rides.map(r => `<tr>
      <td class="mono">${short(r.id)}<div style="color:var(--muted)">${ago(Date.parse(r.createdAt))}</div></td>
      <td>${esc(nameOf(r.riderId))}</td><td>${r.driverId ? esc(nameOf(r.driverId)) : '—'}</td>
      <td><span class="pill ${STATUS_PILL[r.status] || ''}">${esc(r.status)}</span>${r.cancelReason ? `<div style="color:var(--muted)">${esc(r.cancelReason.replace('_', ' '))}</div>` : ''}${timeline(r)}</td>
      <td>${matchCell(r)}</td>
    </tr>`).join('')}</table>` : '<div class="empty">No rides yet. Select a rider and click the map.</div>');
  } else {
    panel.innerHTML = err('offers') + (state.offers.length ? `<table><tr><th>Offer</th><th>Ride</th><th>Driver</th><th>Status</th><th>Expires</th></tr>${state.offers.map(o => {
      const left = Math.round((Date.parse(o.expiresAt) - state.now) / 1000);
      return `<tr><td class="mono">${short(o.id)}</td><td class="mono">${short(o.rideId)}</td><td>${esc(nameOf(o.driverId))}</td>
        <td><span class="pill ${STATUS_PILL[o.status] || ''}">${esc(o.status)}</span></td>
        <td>${o.status === 'pending' ? (left > 0 ? `${left}s` : '<span class="pill warn">past due</span>') : '—'}</td></tr>`;
    }).join('')}</table>` : '<div class="empty">No offers yet. Request a ride, then Start matching.</div>');
  }
}

function toggle(key) { ui.expanded.has(key) ? ui.expanded.delete(key) : ui.expanded.add(key); render(); }

function render() { renderActors(); renderMap(); renderPanel(); }

async function poll() {
  const el = document.getElementById('status');
  try {
    state = await (await fetch('/api/state')).json();
    const errs = Object.keys(state.errors || {});
    el.textContent = errs.length ? `unavailable: ${errs.join(', ')}` : `live · ${state.actors.length} actors · ${state.drivers?.length ?? 0} drivers in Redis`;
    el.className = 'status' + (errs.length ? ' bad' : '');
    state.drivers = state.drivers || [];
  } catch (e) {
    el.textContent = 'devconsole not reachable'; el.className = 'status bad';
  }
  render();
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
