syntax = "proto3";

package payment.v1;

import "google/api/annotations.proto";
service PaymentService {
  rpc ChargeRide(ChargeRideRequest) returns (ChargeRideResponse) {}
  rpc GetCharge(GetChargeRequest) returns (GetChargeResponse) {
    option (google.api.http) = {get: "/v1/rides/{ride_id}/charge"};
  }
  rpc RetryCharge(RetryChargeRequest) returns (RetryChargeResponse) {
    option (google.api.http) = {
      post: "/v1/rides/{ride_id}/charge:retry"
      body: "*"
    };
  }
  rpc SetPaymentMethod(SetPaymentMethodRequest) returns (SetPaymentMethodResponse) {
    option (google.api.http) = {
      put: "/v1/me/payment-method"
      body: "*"
    };
  }
  rpc GetEarnings(GetEarningsRequest) returns (GetEarningsResponse) {
    option (google.api.http) = {get: "/v1/driver/earnings"};
  }
  rpc RefundCharge(RefundChargeRequest) returns (RefundChargeResponse) {}
}

// An amount in the currency's smallest unit used here: whole rupiah for IDR.
message Money {
  int64 amount = 1;
  string currency = 2;
}

enum ChargeKind {
  CHARGE_KIND_UNSPECIFIED = 0;
  CHARGE_KIND_FARE = 1;
  CHARGE_KIND_CANCELLATION_FEE = 2;
}

enum ChargeStatus {
  CHARGE_STATUS_UNSPECIFIED = 0;
  CHARGE_STATUS_PENDING = 1;
  CHARGE_STATUS_CAPTURED = 2;
  CHARGE_STATUS_FAILED = 3;
}

// Records that the rider owes this and returns once it is saved; the provider is called in the background, so a slow
// provider never holds up ride's outbox. Idempotent: a ride has one charge, and a repeat keeps the first.
message ChargeRideRequest {
  string ride_id = 1;
  string rider_id = 2;
  string driver_id = 3;
  ChargeKind kind = 4;
  Money amount = 5;
}

message ChargeRideResponse {}

// NOT_FOUND: no charge for this ride that the caller is the rider or driver of.
message GetChargeRequest {
  string ride_id = 1;
}

message GetChargeResponse {
  Charge charge = 1;
}

message Charge {
  string charge_id = 1;
  string ride_id = 2;
  ChargeKind kind = 3;
  ChargeStatus status = 4;
  Money amount = 5;
  // Why the provider refused; empty unless the status is failed.
  string decline_reason = 6;
  // What has actually gone back to the rider, in the charge's currency.
  int64 refunded_amount = 7;
  repeated Refund refunds = 8;
}

// The rider tries a declined charge again, usually after SetPaymentMethod. Idempotent: a pending or captured charge
// is left as it is. NOT_FOUND: no charge on this ride for this rider.
message RetryChargeRequest {
  string ride_id = 1;
}

message RetryChargeResponse {}

// Sets the caller's card, as the opaque token a provider issues. The fake provider's tokens are tok_ok, tok_declined,
// tok_lost_response, tok_refund_refused and tok_refund_lost.
message SetPaymentMethodRequest {
  string token = 1;
}

message SetPaymentMethodResponse {}

// What the ledger says the calling driver has earned, per currency.
message GetEarningsRequest {}

message GetEarningsResponse {
  repeated Money balances = 1;
}

enum RefundStatus {
  REFUND_STATUS_UNSPECIFIED = 0;
  REFUND_STATUS_PENDING = 1;
  REFUND_STATUS_SUCCEEDED = 2;
  REFUND_STATUS_FAILED = 3;
}

message Refund {
  string refund_id = 1;
  Money amount = 2;
  RefundStatus status = 3;
  string reason = 4;
  // Why the provider refused; empty unless the status is failed.
  string failure_reason = 5;
}

// Returns part or all of a captured charge. Returns once the refund is saved; the provider is called in the
// background. Idempotent per idempotency_key: a repeat returns the first refund. A pending refund counts against what
// is left to refund; a failed one doesn't.
// NOT_FOUND: no charge for this ride. FAILED_PRECONDITION: the charge isn't captured, the amount is more than what is
// left, or the key was already used for a different refund.
message RefundChargeRequest {
  string ride_id = 1;
  // In the charge's currency.
  int64 amount = 2;
  string idempotency_key = 3;
  string reason = 4;
}

message RefundChargeResponse {
  Refund refund = 1;
}
