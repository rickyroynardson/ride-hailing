syntax = "proto3";

package location.v1;

import "google/protobuf/timestamp.proto";

service LocationService {
  rpc UpdateDriverLocation(UpdateDriverLocationRequest) returns (UpdateDriverLocationResponse) {}
  rpc GoOffline(GoOfflineRequest) returns (GoOfflineResponse) {}
}

message Location {
  double lat = 1;
  double lng = 2;
}

message UpdateDriverLocationRequest {
  Location location = 1;
  double accuracy_meters = 2;
  google.protobuf.Timestamp recorded_at = 3;
}

message UpdateDriverLocationResponse {}

message GoOfflineRequest {}

message GoOfflineResponse {}
