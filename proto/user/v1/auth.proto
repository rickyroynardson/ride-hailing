syntax = "proto3";

package user.v1;

import "user/v1/user.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string phone = 4;
}

message RegisterResponse {
  User user = 1;
  Token tokens = 2;
}

message Token {
  string access_token = 1;
  string refresh_token = 2;
}
