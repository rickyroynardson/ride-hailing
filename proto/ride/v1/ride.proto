syntax = "proto3";

package ride.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service RideService {
  rpc GetCurrentRide(GetCurrentRideRequest) returns (GetCurrentRideResponse) {
    option (google.api.http) = {get: "/v1/rides/current"};
  }
  rpc EstimateFare(EstimateFareRequest) returns (EstimateFareResponse) {
    option (google.api.http) = {
      post: "/v1/fares:estimate"
      body: "*"
    };
  }
  rpc CreateRide(CreateRideRequest) returns (CreateRideResponse) {
    option (google.api.http) = {
      post: "/v1/rides"
      body: "*"
    };
  }
  rpc FilterAvailableDrivers(FilterAvailableDriversRequest) returns (FilterAvailableDriversResponse);
  rpc AssignDriver(AssignDriverRequest) returns (AssignDriverResponse);
  rpc MarkNoDriver(MarkNoDriverRequest) returns (MarkNoDriverResponse);
  rpc CancelRide(CancelRideRequest) returns (CancelRideResponse) {
    option (google.api.http) = {
      post: "/v1/rides/{ride_id}:cancel"
      body: "*"
    };
  }
  rpc StartRide(StartRideRequest) returns (StartRideResponse) {
    option (google.api.http) = {
      post: "/v1/rides/{ride_id}:start"
      body: "*"
    };
  }
  rpc CompleteRide(CompleteRideRequest) returns (CompleteRideResponse) {
    option (google.api.http) = {
      post: "/v1/rides/{ride_id}:complete"
      body: "*"
    };
  }
  rpc WatchRide(WatchRideRequest) returns (stream WatchRideResponse) {
    option (google.api.http) = {get: "/v1/rides/{ride_id}:watch"};
  }
  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse);
}

message Location {
  double lat = 1;
  double lng = 2;
}

// An amount in the currency's smallest unit used here: whole rupiah for IDR.
message Money {
  int64 amount = 1;
  string currency = 2;
}

// What a ride between these points would cost. CreateRide prices it the same way and fixes the fare on the ride.
message EstimateFareRequest {
  Location pickup = 1;
  Location dropoff = 2;
}

message EstimateFareResponse {
  Money fare = 1;
}

// Idempotent per authenticated rider and request_id: retries return the original ride and stored fare, even after
// the trip ends. Reusing the key for different pickup/dropoff coordinates is FAILED_PRECONDITION.
// FAILED_PRECONDITION: the rider has an unpaid ride; they must settle it first (does not block a replay).
message CreateRideRequest {
  Location pickup = 1;
  Location dropoff = 2;
  // Required UUID, generated once per booking intent. Keep it and the coordinates unchanged on every retry.
  string request_id = 3;
}

// No user ID is accepted: this only returns the authenticated caller's active trip. If a caller is both a rider and
// a driver with active trips, their driver trip takes priority. Historical receipts are not returned.
message GetCurrentRideRequest {}

message GetCurrentRideResponse {
  // Unset if the caller has no active trip.
  Ride ride = 1;
}

message CreateRideResponse {
  string ride_id = 1;
  Money fare = 2;
}

message FilterAvailableDriversRequest {
  repeated string driver_ids = 1;
}

message FilterAvailableDriversResponse {
  repeated string driver_ids = 1;
}

// Idempotent: succeeds again if the ride is already assigned to this driver.
// FAILED_PRECONDITION: the ride is no longer requested (cancelled, or assigned to someone else).
// ALREADY_EXISTS: the driver already has an active ride.
message AssignDriverRequest {
  string ride_id = 1;
  string driver_id = 2;
}

message AssignDriverResponse {}

// Ends a requested ride as cancelled with reason no_driver. Idempotent: an already cancelled ride succeeds.
// FAILED_PRECONDITION: the ride has a driver (accepted, in progress or completed).
message MarkNoDriverRequest {
  string ride_id = 1;
}

message MarkNoDriverResponse {}

// The rider cancels their ride before the trip starts. Idempotent: an already cancelled ride succeeds.
// NOT_FOUND: no such ride for this rider. FAILED_PRECONDITION: the trip has started or finished.
message CancelRideRequest {
  string ride_id = 1;
}

message CancelRideResponse {}

// The ride's driver picked the rider up: accepted → in_progress. Idempotent, also once the trip has completed.
// NOT_FOUND: no such ride for this driver. FAILED_PRECONDITION: the ride isn't accepted (e.g. cancelled).
message StartRideRequest {
  string ride_id = 1;
}

message StartRideResponse {}

// The ride's driver dropped the rider off: in_progress → completed. Idempotent.
// NOT_FOUND: no such ride for this driver. FAILED_PRECONDITION: the trip hasn't started.
message CompleteRideRequest {
  string ride_id = 1;
}

message CompleteRideResponse {}

// Payment reports how the ride's charge ended. Idempotent, and PAID is final: a late FAILED can't undo it.
// NOT_FOUND: no such ride.
message RecordPaymentRequest {
  string ride_id = 1;
  PaymentOutcome outcome = 2;
}

message RecordPaymentResponse {}

enum PaymentOutcome {
  PAYMENT_OUTCOME_UNSPECIFIED = 0;
  PAYMENT_OUTCOME_PAID = 1;
  PAYMENT_OUTCOME_FAILED = 2;
}

message WatchRideRequest {
  string ride_id = 1;
}

message WatchRideResponse {
  Ride ride = 1;
}

message Ride {
  string ride_id = 1;
  RideStatus status = 2;
  CancelReason cancel_reason = 3;
  Location pickup = 4;
  Location dropoff = 5;
  string driver_id = 6;
  Location driver_location = 7;
  google.protobuf.Timestamp requested_at = 8;
  google.protobuf.Timestamp accepted_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
  Money fare = 12;
  // The original rider-scoped booking key, empty on legacy rides.
  string request_id = 13;
}

enum RideStatus {
  RIDE_STATUS_UNSPECIFIED = 0;
  RIDE_STATUS_REQUESTED = 1;
  RIDE_STATUS_ACCEPTED = 2;
  RIDE_STATUS_IN_PROGRESS = 3;
  RIDE_STATUS_COMPLETED = 4;
  RIDE_STATUS_CANCELLED = 5;
}

enum CancelReason {
  CANCEL_REASON_UNSPECIFIED = 0;
  CANCEL_REASON_RIDER = 1;
  CANCEL_REASON_NO_DRIVER = 2;
}
