x-auth-env: &auth-env
  TLS_DIR: "/security"
  AUTH_TRUST_BUNDLE_FILE: "/security/trust.json"
  SERVICE_TOKEN_URL: "https://identity:8080/token"

x-security-volume: &security-volume
  labels:
    ride-hailing.security: "true"

x-health: &health
  test: ["CMD", "/probe", "-url", "http://127.0.0.1:8080/readyz"]
  interval: 3s
  timeout: 2s
  start_period: 10s
  retries: 3

x-lifecycle: &lifecycle
  stop_grace_period: 12s
  healthcheck: *health

x-deployment-fixture: &deployment-fixture
  <<: *lifecycle
  profiles: [deployment-check]
  image: ride-hailing-deployment-check
  build:
    context: .
    dockerfile: services/deployment-check/Dockerfile
  command: ["serve"]
  environment:
    <<: *auth-env
    STORE_URL: "postgres://postgres:postgres@deployment-store:5432/deployment?sslmode=disable"
  volumes:
    - security_payment:/security:ro
  depends_on:
    security-init:
      condition: service_completed_successfully
    deployment-store:
      condition: service_healthy

services:
  deployment-a:
    <<: *deployment-fixture
  deployment-b:
    <<: *deployment-fixture
  deployment-check:
    profiles: [deployment-check]
    image: ride-hailing-deployment-check
    environment:
      <<: *auth-env
      SERVICE_CLIENT_FILE: "/security/client.json"
      STORE_URL: "postgres://postgres:postgres@deployment-store:5432/deployment?sslmode=disable"
    volumes:
      - security_ride:/security:ro
  deployment-store:
    profiles: [deployment-check]
    image: postgres:latest
    init: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deployment
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./scripts/postgres/deployment-check.sql:/docker-entrypoint-initdb.d/deployment.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deployment"]
      interval: 1s
      timeout: 2s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: services/migrate/Dockerfile
    environment:
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot, idempotent provisioning. Only this container can access the CA private key.
  security-init:
    build:
      context: .
      dockerfile: services/security-init/Dockerfile
    network_mode: none
    volumes:
      - security_ca:/state/ca
      - security_identity:/state/identity
      - security_user:/state/user
      - security_ride:/state/ride
      - security_location:/state/location
      - security_matching:/state/matching
      - security_payment:/state/payment
      - security_gateway:/state/gateway
      - security_devconsole:/state/devconsole
      - security_checks:/state/checks

  security-check:
    profiles: [security-check]
    build:
      context: .
      dockerfile: services/security-check/Dockerfile
    environment:
      <<: *auth-env
      SERVICE_CLIENT_FILE: "/security/client.json"
    volumes:
      - security_ride:/security:ro
      - security_checks:/checks:ro

  identity:
    <<: *lifecycle
    healthcheck:
      <<: *health
      test: ["CMD", "/probe", "-url", "http://127.0.0.1:9090/readyz"]
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      TLS_DIR: "/security"
      SERVICE_SIGNING_KEY_FILE: "/security/signing.json"
      SERVICE_CLIENTS_FILE: "/security/clients.json"
    volumes:
      - security_identity:/security:ro
    depends_on:
      security-init:
        condition: service_completed_successfully
    # No host port or public gateway route. Only internal workloads exchange client credentials here.

  postgres:
    image: postgres:latest
    # Postgres as PID 1 reaps every orphan in the container, and treats one that exits non-zero as a crashed backend:
    # it kills every connection and recovers. A healthcheck that times out under load is exactly that. An init takes
    # PID 1 and reaps them instead.
    init: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  user:
    <<: *lifecycle
    container_name: user-service
    build:
      context: .
      dockerfile: services/user/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      <<: *auth-env
      USER_SIGNING_KEY_FILE: "/security/signing.json"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - security_user:/security:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      security-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  ride:
    <<: *lifecycle
    container_name: ride-service
    build:
      context: .
      dockerfile: services/ride/Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:50052:50051"
    environment:
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/rides?sslmode=disable"
      <<: *auth-env
      SERVICE_CLIENT_FILE: "/security/client.json"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - security_ride:/security:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      security-init:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy

  location:
    <<: *lifecycle
    container_name: location-service
    build:
      context: .
      dockerfile: services/location/Dockerfile
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:50053:50051"
    environment:
      REDIS_URL: "redis://redis:6379/0"
      <<: *auth-env
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - security_location:/security:ro
    depends_on:
      security-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  matching:
    <<: *lifecycle
    container_name: matching-service
    build:
      context: .
      dockerfile: services/matching/Dockerfile
    ports:
      - "127.0.0.1:8083:8080"
      - "127.0.0.1:50054:50051"
    environment:
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/matching?sslmode=disable"
      <<: *auth-env
      SERVICE_CLIENT_FILE: "/security/client.json"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - security_matching:/security:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      security-init:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy

  payment:
    <<: *lifecycle
    container_name: payment-service
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    ports:
      - "127.0.0.1:8084:8080"
      - "127.0.0.1:50055:50051"
    environment:
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/payments?sslmode=disable"
      <<: *auth-env
      SERVICE_CLIENT_FILE: "/security/client.json"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - security_payment:/security:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      security-init:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # The public API: the only service clients talk to. The others keep their localhost ports for development
  # (grpcurl, running a service from the host); a deployment would expose only this one.
  gateway:
    <<: *lifecycle
    container_name: gateway
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8085:8080"
    environment:
      TLS_DIR: "/security"
      # Its own Redis database, apart from location's driver positions.
      REDIS_URL: "redis://redis:6379/1"
      # Raise for load runs: tools/loadgen signs every user up from one IP.
      AUTH_LIMIT_PER_MINUTE: "${AUTH_LIMIT_PER_MINUTE:-10}"
      USER_LIMIT_PER_MINUTE: "${USER_LIMIT_PER_MINUTE:-300}"
      ANON_LIMIT_PER_MINUTE: "${ANON_LIMIT_PER_MINUTE:-60}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - security_gateway:/security:ro
    depends_on:
      security-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Optional real client. Only its nginx proxy talks to the gateway; the browser gets no service credentials.
  web:
    profiles: [web]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      gateway:
        condition: service_started

  # Development-only UI: holds a scoped admin identity and reads every service's database. Never deploy it.
  devconsole:
    <<: *lifecycle
    healthcheck:
      <<: *health
      test: ["CMD", "/probe", "-url", "http://127.0.0.1:9000/readyz"]
    container_name: devconsole
    build:
      context: .
      dockerfile: tools/devconsole/Dockerfile
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      GATEWAY_URL: "http://gateway:8000"
      MATCHING_ADDR: "matching:50051"
      PAYMENT_ADDR: "payment:50051"
      USERS_DB_URL: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      RIDES_DB_URL: "postgres://postgres:postgres@postgres:5432/rides?sslmode=disable"
      MATCHING_DB_URL: "postgres://postgres:postgres@postgres:5432/matching?sslmode=disable"
      PAYMENTS_DB_URL: "postgres://postgres:postgres@postgres:5432/payments?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      <<: *auth-env
      SERVICE_CLIENT_FILE: "/security/client.json"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - security_devconsole:/security:ro
    depends_on:
      security-init:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user:
        condition: service_started
      ride:
        condition: service_started
      location:
        condition: service_started
      matching:
        condition: service_started
      payment:
        condition: service_started
      gateway:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector:latest
    volumes:
      - ./scripts/configs/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
    depends_on:
      - jaeger
      - tempo
      - loki

  jaeger:
    image: jaegertracing/jaeger:latest
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:16686:16686"

  tempo:
    image: grafana/tempo:latest
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./scripts/configs/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  loki:
    image: grafana/loki:latest
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./scripts/configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - user
      - ride
      - location
      - matching
      - payment
      - gateway

volumes:
  security_ca: *security-volume
  security_identity: *security-volume
  security_user: *security-volume
  security_ride: *security-volume
  security_location: *security-volume
  security_matching: *security-volume
  security_payment: *security-volume
  security_gateway: *security-volume
  security_devconsole: *security-volume
  security_checks: *security-volume
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
  tempo_data:
