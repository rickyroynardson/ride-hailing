services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  user:
    container_name: user-service
    build:
      context: .
      dockerfile: services/user/Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      JWT_SECRET: "dev-secret-change-me"
    depends_on:
      postgres:
        condition: service_healthy

  ride:
    container_name: ride-service
    build:
      context: .
      dockerfile: services/ride/Dockerfile
    ports:
      - "8081:8080"
      - "50052:50051"
    environment:
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/rides?sslmode=disable"
      JWT_SECRET: "dev-secret-change-me"
    depends_on:
      postgres:
        condition: service_healthy

  location:
    container_name: location-service
    build:
      context: .
      dockerfile: services/location/Dockerfile
    ports:
      - "8082:8080"
      - "50053:50051"
    environment:
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "dev-secret-change-me"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - user
      - ride
      - location

volumes:
  postgres_data:
