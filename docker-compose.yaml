services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  user:
    container_name: user-service
    build:
      context: .
      dockerfile: services/user/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      JWT_SECRET: "dev-secret-change-me"
    depends_on:
      postgres:
        condition: service_healthy

  ride:
    container_name: ride-service
    build:
      context: .
      dockerfile: services/ride/Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:50052:50051"
    environment:
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/rides?sslmode=disable"
      JWT_SECRET: "dev-secret-change-me"
    depends_on:
      postgres:
        condition: service_healthy

  location:
    container_name: location-service
    build:
      context: .
      dockerfile: services/location/Dockerfile
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:50053:50051"
    environment:
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "dev-secret-change-me"
    depends_on:
      redis:
        condition: service_healthy

  matching:
    container_name: matching-service
    build:
      context: .
      dockerfile: services/matching/Dockerfile
    ports:
      - "127.0.0.1:8083:8080"
      - "127.0.0.1:50054:50051"
    environment:
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/matching?sslmode=disable"
      JWT_SECRET: "dev-secret-change-me"
    depends_on:
      postgres:
        condition: service_healthy

  # Development-only UI: holds the JWT secret and reads every service's database. Never deploy it.
  devconsole:
    container_name: devconsole
    build:
      context: .
      dockerfile: tools/devconsole/Dockerfile
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      USER_ADDR: "user:50051"
      RIDE_ADDR: "ride:50051"
      LOCATION_ADDR: "location:50051"
      MATCHING_ADDR: "matching:50051"
      USERS_DB_URL: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      RIDES_DB_URL: "postgres://postgres:postgres@postgres:5432/rides?sslmode=disable"
      MATCHING_DB_URL: "postgres://postgres:postgres@postgres:5432/matching?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "dev-secret-change-me"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user:
        condition: service_started
      ride:
        condition: service_started
      location:
        condition: service_started
      matching:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - user
      - ride
      - location
      - matching

volumes:
  postgres_data:
  prometheus_data:
