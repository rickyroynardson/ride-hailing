global:
  scrape_interval: 15s

scrape_configs:
  - job_name: user-service
    static_configs:
      - targets: ["user:8080"]
  - job_name: ride-service
    static_configs:
      - targets: ["ride:8080"]
  - job_name: location-service
    static_configs:
      - targets: ["location:8080"]
  - job_name: matching-service
    static_configs:
      - targets: ["matching:8080"]
  - job_name: payment-service
    static_configs:
      - targets: ["payment:8080"]
